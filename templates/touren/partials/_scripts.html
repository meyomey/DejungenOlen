<script>
// ── Reply toggle ─────────────────────────────────────────────────────────────
function showReply(id) {
  const el = document.getElementById('reply-' + id);
  el.classList.toggle('d-none');
  if (!el.classList.contains('d-none')) el.querySelector('textarea').focus();
}

// ── GPS Modal ─────────────────────────────────────────────────────────────────
let gpsModalMap = null, gpsModalMarker = null;

function openGpsModal(photoId, existingLat, existingLng) {
  const form = document.getElementById('gpsModalForm');
  form.action = '/fotos/' + photoId + '/gps';

  const modal = new bootstrap.Modal(document.getElementById('gpsModal'));
  modal.show();

  document.getElementById('gpsModal').addEventListener('shown.bs.modal', function initMap() {
    if (!gpsModalMap) {
      const startLat = existingLat || {{ tour.meeting_lat or 53.1 }};
      const startLng = existingLng || {{ tour.meeting_lng or 9.2 }};

      gpsModalMap = L.map('gps-modal-map').setView([startLat, startLng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(gpsModalMap);

      gpsModalMap.on('click', function(e) {
        setGpsMarker(e.latlng.lat, e.latlng.lng);
      });
    } else {
      gpsModalMap.invalidateSize();
    }

    if (existingLat && existingLng) {
      setGpsMarker(existingLat, existingLng);
      gpsModalMap.setView([existingLat, existingLng], 16);
    }

    this.removeEventListener('shown.bs.modal', initMap);
  });
}

function setGpsMarker(lat, lng) {
  document.getElementById('gps-modal-lat').value = lat.toFixed(6);
  document.getElementById('gps-modal-lng').value = lng.toFixed(6);
  if (gpsModalMarker) gpsModalMap.removeLayer(gpsModalMarker);
  gpsModalMarker = L.marker([lat, lng]).addTo(gpsModalMap);
}

// Sync manual coord input → map marker
['gps-modal-lat', 'gps-modal-lng'].forEach(id => {
  document.getElementById(id)?.addEventListener('change', function() {
    const lat = parseFloat(document.getElementById('gps-modal-lat').value);
    const lng = parseFloat(document.getElementById('gps-modal-lng').value);
    if (!isNaN(lat) && !isNaN(lng)) {
      setGpsMarker(lat, lng);
      gpsModalMap.setView([lat, lng], 15);
    }
  });
});


// ── Elevation overlay on map ─────────────────────────────────────────────────// ── Elevation overlay on map ─────────────────────────────────────────────────
let elevOverlayChart = null;
let elevOverlayVisible = false;

function toggleElevationOverlay() {
  const overlay = document.getElementById('elev-overlay');
  const btn     = document.getElementById('btn-elev');
  if (!overlay) return;

  elevOverlayVisible = !elevOverlayVisible;
  overlay.style.display = elevOverlayVisible ? 'block' : 'none';
  btn.classList.toggle('active', elevOverlayVisible);

  if (elevOverlayVisible && !elevOverlayChart && GPX_DATA) {
    buildElevOverlay();
  }
  // Resize map after showing/hiding overlay
  setTimeout(() => map.invalidateSize(), 50);
}

function buildElevOverlay() {
  if (!GPX_DATA || !GPX_DATA.points) return;
  const allPts = GPX_DATA.points;
  const step   = Math.max(1, Math.floor(allPts.length / 400));
  const pts    = allPts.filter((_, i) => i % step === 0);
  const eles   = pts.map(p => p.ele);

  // cumulative km (reuse haverDist if available, else inline)
  const cumKm2 = [0];
  for (let i = 1; i < pts.length; i++) {
    const R=6371, dLat=(pts[i].lat-pts[i-1].lat)*Math.PI/180,
          dLon=(pts[i].lng-pts[i-1].lng)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(pts[i-1].lat*Math.PI/180)*Math.cos(pts[i].lat*Math.PI/180)*Math.sin(dLon/2)**2;
    cumKm2.push(cumKm2[i-1]+R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
  }

  const ctx = document.getElementById('elev-overlay-chart');
  elevOverlayChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map((_,i) => i),
      datasets: [{
        data: eles,
        borderColor: 'rgba(255,220,80,.9)',
        backgroundColor: 'rgba(255,220,80,.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: '#ff4444',
        borderWidth: 1.5
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(10,20,50,.9)',
          titleColor: '#ffd',
          bodyColor: '#cce',
          callbacks: {
            title: items => `Km ${cumKm2[items[0].dataIndex].toFixed(2)}`,
            label: item => {
              const i = item.dataIndex;
              return [`⛰️ ${eles[i].toFixed(0)} m`, `📍 ${pts[i].lat.toFixed(4)}, ${pts[i].lng.toFixed(4)}`];
            }
          }
        }
      },
      hover: { mode: 'index', intersect: false },
      scales: {
        x: { display: false },
        y: {
          position: 'right',
          grid: { color: 'rgba(255,255,255,.1)' },
          ticks: { color: 'rgba(255,220,80,.8)', font: { size: 9 },
                   callback: v => v + 'm' }
        }
      },
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      onHover: (evt, elements) => {
        if (!elements || !elements.length) {
          if (crosshair) { map.removeLayer(crosshair); crosshair = null; }
          document.getElementById('elev-overlay-info').textContent = '';
          return;
        }
        const i   = elements[0].index;
        const pt  = pts[i];
        const info = document.getElementById('elev-overlay-info');
        info.textContent = `Km ${cumKm2[i].toFixed(2)} · ${pt.ele.toFixed(0)} m`;
        if (crosshair) {
          crosshair.setLatLng([pt.lat, pt.lng]);
        } else {
          const cIcon = L.divIcon({
            html: '<div style="width:12px;height:12px;background:#ff4;border:2px solid #f80;border-radius:50%;box-shadow:0 0 8px rgba(255,200,0,.8)"></div>',
            iconSize:[12,12], iconAnchor:[6,6], className:''
          });
          crosshair = L.marker([pt.lat, pt.lng], { icon: cIcon, zIndexOffset: 1000 }).addTo(map);
        }
      }
    }
  });
}

// ── Lightbox mit Navigation + Wischfunktion ──────────────────────────────────
let _lbModal = null;
let _lbPhotos = [];  // [{src, cap}]
let _lbIdx   = 0;

// Build gallery index from all photo thumbnails on page
function _buildLbIndex() {
  _lbPhotos = [];
  document.querySelectorAll('[data-lb-src]').forEach(el => {
    _lbPhotos.push({ src: el.dataset.lbSrc, cap: el.dataset.lbCap || '' });
  });
}

function openLightbox(src, cap) {
  _buildLbIndex();
  _lbIdx = _lbPhotos.findIndex(p => p.src === src);
  if (_lbIdx < 0) { _lbPhotos = [{src, cap}]; _lbIdx = 0; }
  _lbShow();
  if (!_lbModal) _lbModal = new bootstrap.Modal(document.getElementById('lightboxModal'));
  _lbModal.show();
}

function lbOpenFromEl(el) {
  // Use data attributes to avoid quote-escaping issues with captions
  const src = el.dataset.lbSrc || el.src;
  const cap = el.dataset.lbCap || '';
  openLightbox(src, cap);
}

function _lbShow() {
  const p = _lbPhotos[_lbIdx];
  const img = document.getElementById('lightbox-img');
  img.style.opacity = '0';
  img.style.transition = '';
  img.onload = () => {
    img.style.transition = 'opacity .2s';
    img.style.opacity = '1';
  };
  img.src = p.src;
  // Gecachte Bilder: onload feuert nicht – sofort einblenden
  if (img.complete && img.naturalWidth > 0) {
    img.style.opacity = '1';
  }
  const capEl = document.getElementById('lb-cap');
  if (p.cap) {
    capEl.textContent = p.cap;
    capEl.style.display = '';
  } else {
    capEl.textContent = '';
    capEl.style.display = 'none';
  }
  document.getElementById('lb-counter').textContent =
    _lbPhotos.length > 1 ? `${_lbIdx+1} / ${_lbPhotos.length}` : '';
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  if (prev) prev.style.opacity = _lbIdx > 0 ? '1' : '0.3';
  if (next) next.style.opacity = _lbIdx < _lbPhotos.length-1 ? '1' : '0.3';
  // Adjust image height for landscape on mobile
  _lbAdjustOrientation();
}

function _lbAdjustOrientation() {
  // modal-fullscreen übernimmt Sizing – nichts zu tun
}

// Re-adjust when phone rotates
window.addEventListener('orientationchange', () => setTimeout(_lbAdjustOrientation, 100));
window.addEventListener('resize', _lbAdjustOrientation);
// Screen Orientation API (moderner, schneller)
if (screen && screen.orientation) {
  screen.orientation.addEventListener('change', () => setTimeout(_lbAdjustOrientation, 100));
}

function lbNav(dir) {
  const n = _lbIdx + dir;
  if (n >= 0 && n < _lbPhotos.length) { _lbIdx = n; _lbShow(); }
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightboxModal').classList.contains('show')) return;
  if (e.key === 'ArrowLeft')  lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

// Touch/swipe support in lightbox
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('lightboxModal');
  if (!modal) return;
  let touchX = 0, touchY = 0;
  modal.addEventListener('touchstart', e => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, {passive:true});
  modal.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    // Nur horizontale Swipes (dx > dy) auswerten
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      lbNav(dx < 0 ? 1 : -1);
    }
  }, {passive:true});

  // Clear src on close
document.getElementById('lightboxModal').addEventListener('hidden.bs.modal',  () => {
  document.getElementById('lightbox-img').src = '';
});

// Fullscreen-Änderung: CSS anpassen
});

// ── Client-side EXIF GPS/DateTime reader (preserves data stripped by mobile browsers) ──
function readExifFromBuffer(buf) {
  /** Returns {lat, lng, datetime} from JPEG ArrayBuffer. Pure JS, no libs. */
  const data = new DataView(buf);
  if (data.getUint16(0) !== 0xFFD8) return {}; // not JPEG
  let off = 2;
  while (off < data.byteLength - 4) {
    const marker = data.getUint16(off);
    const segLen = data.getUint16(off + 2);
    if (marker === 0xFFE1) { // APP1
      const hdr = String.fromCharCode(
        data.getUint8(off+4), data.getUint8(off+5),
        data.getUint8(off+6), data.getUint8(off+7));
      if (hdr === 'Exif') {
        return _parseExif(buf, off + 10);
      }
    }
    if (marker === 0xFFDA) break; // SOS - image data starts
    off += 2 + segLen;
  }
  return {};
}

function _parseExif(buf, tiffStart) {
  const data = new DataView(buf);
  const bo = data.getUint16(tiffStart); // 0x4949=LE, 0x4D4D=BE
  const le = bo === 0x4949;
  const r16 = o => le ? data.getUint16(tiffStart+o, true) : data.getUint16(tiffStart+o);
  const r32 = o => le ? data.getUint32(tiffStart+o, true) : data.getUint32(tiffStart+o);
  const rat = o => { const n=r32(o), d=r32(o+4); return d ? n/d : 0; };
  const str = (o, l) => {
    let s = '';
    for (let i=0; i<l; i++) { const c=data.getUint8(tiffStart+o+i); if (c===0) break; s+=String.fromCharCode(c); }
    return s.trim();
  };

  const ifd0 = r32(4);
  const n0   = r16(ifd0);
  let gpsOff = null, dtOrig = null;

  for (let i=0; i<n0; i++) {
    const e = ifd0 + 2 + i*12;
    const tag = r16(e);
    if (tag === 0x8825) gpsOff = r32(e+8);  // GPS IFD
    if (tag === 0x0132) dtOrig = str(r32(e+8), 20); // DateTime
  }

  // Also check Exif IFD for DateTimeOriginal
  for (let i=0; i<n0; i++) {
    const e = ifd0 + 2 + i*12;
    if (r16(e) === 0x8769) { // Exif IFD
      const exifOff = r32(e+8);
      const ne = r16(exifOff);
      for (let j=0; j<ne; j++) {
        const ee = exifOff + 2 + j*12;
        if (r16(ee) === 0x9003) { dtOrig = str(r32(ee+8), 20); break; } // DateTimeOriginal
      }
      break;
    }
  }

  if (!gpsOff) return {datetime: dtOrig};

  const ng = r16(gpsOff);
  const gps = {};
  for (let i=0; i<ng; i++) {
    const e = gpsOff + 2 + i*12;
    const tag = r16(e), type = r16(e+2), cnt = r32(e+4), voff = r32(e+8);
    if (type === 2) { // ASCII ref
      gps[tag] = String.fromCharCode(data.getUint8(tiffStart+voff)).trim();
    } else if (type === 5) { // RATIONAL
      gps[tag] = [rat(voff), rat(voff+8), rat(voff+16)];
    }
  }

  if (!gps[2] || !gps[4]) return {datetime: dtOrig};
  const dms = (v, ref) => {
    const dec = v[0] + v[1]/60 + v[2]/3600;
    return (ref==='S'||ref==='W') ? -dec : dec;
  };
  return {
    lat: Math.round(dms(gps[2], gps[1]||'N') * 1e6) / 1e6,
    lng: Math.round(dms(gps[4], gps[3]||'E') * 1e6) / 1e6,
    datetime: dtOrig,
  };
}

async function photoFilesSelected(input) {
  const files  = Array.from(input.files).filter(f => !f.name.toLowerCase().endsWith('.zip'));
  const hidden = document.getElementById('gps-hidden-fields');
  const status = document.getElementById('gps-status');
  const names  = document.getElementById('photo-names');
  const submit = document.getElementById('photo-submit-row');

  if (names) names.textContent = input.files.length === 1
    ? `✓ ${input.files[0].name}`
    : `✓ ${input.files.length} Fotos ausgewählt`;

  if (!hidden || !files.length) {
    if (submit) submit.classList.remove('d-none');
    return;
  }

  hidden.innerHTML = '';
  if (status) status.textContent = 'Lese GPS-Daten…';

  let gpsFound = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      // arrayBuffer() is widely supported but wrap in try for safety
      const buf  = await files[i].arrayBuffer();
      const exif = readExifFromBuffer(buf);
      if (exif.lat != null && exif.lng != null && !isNaN(exif.lat) && !isNaN(exif.lng)) {
        hidden.innerHTML +=
          `<input type="hidden" name="gps_lat_${i}" value="${exif.lat}">` +
          `<input type="hidden" name="gps_lng_${i}" value="${exif.lng}">`;
        gpsFound++;
      }
      if (exif.datetime) {
        hidden.innerHTML +=
          `<input type="hidden" name="exif_dt_${i}" value="${exif.datetime}">`;
      }
    } catch(e) {
      console.warn('EXIF read failed for', files[i].name, e);
    }
  }

  if (status) status.textContent = gpsFound
    ? `✅ GPS in ${gpsFound} von ${files.length} Foto(s) gefunden`
    : `ℹ️ Kein GPS in den Fotos gefunden`;
  if (submit) submit.classList.remove('d-none');
}

// ── Drag & Drop + Clipboard paste ────────────────────────────────────────────
// Listen for paste anywhere on the page when photo drop zone is visible
document.addEventListener('paste', (e) => {
  const input  = document.getElementById('photo-input');
  const drop   = document.getElementById('photo-drop');
  const names  = document.getElementById('photo-names');
  const submit = document.getElementById('photo-submit-row');
  if (!input || !drop) return;

  const items = Array.from(e.clipboardData.items || [])
    .filter(i => i.type.startsWith('image/'));
  if (!items.length) return;

  e.preventDefault();
  const dt = new DataTransfer();
  let count = 0;
  items.forEach((item, idx) => {
    const file = item.getAsFile();
    if (!file) return;
    // Give it a sensible name
    const ext  = file.type.split('/')[1] || 'jpg';
    const ts   = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    const named = new File([file], `clipboard-${ts}-${idx}.${ext}`, {type: file.type});
    dt.items.add(named);
    count++;
  });

  if (!count) return;
  input.files = dt.files;
  if (names) names.textContent = count === 1
    ? `📋 ${dt.files[0].name}`
    : `📋 ${count} Fotos aus Zwischenablage`;
  if (submit) submit.classList.remove('d-none');

  // Visual feedback on drop zone
  drop.style.borderColor   = '#198754';
  drop.style.background    = 'rgba(25,135,84,.08)';
  setTimeout(() => {
    drop.style.borderColor = '#adb5bd';
    drop.style.background  = '';
  }, 1500);
});

// ── Drag & Drop helper functions ─────────────────────────────────────────────
function dzOver(e, id) {
  e.preventDefault();
  const el = document.getElementById(id);
  el.style.borderColor   = '#2B3F6B';
  el.style.background    = 'rgba(43,63,107,.08)';
  el.style.transform     = 'scale(1.01)';
}
function dzLeave(id) {
  const el = document.getElementById(id);
  el.style.borderColor   = '#adb5bd';
  el.style.background    = '';
  el.style.transform     = '';
}
function dzDrop(e, zoneId, inputId, formId) {
  e.preventDefault();
  dzLeave(zoneId);
  const input = document.getElementById(inputId);
  const dt    = new DataTransfer();
  Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
  input.files = dt.files;
  if (formId) {
    // GPX: show name, auto-submit
    const nameEl = document.getElementById(zoneId === 'gpx-drop' ? 'gpx-name' : 'photo-names');
    if (nameEl) nameEl.textContent = `✓ ${dt.files[0].name}`;
    setTimeout(() => document.getElementById(formId).submit(), 400);
  } else {
    // Photos: run GPS extraction first, THEN show submit
    photoFilesSelected(input);
  }
}
function dzPickFile(input, nameId, formId) {
  const files = Array.from(input.files);
  const el = document.getElementById(nameId);
  if (el) el.textContent = files.length === 1
    ? `✓ ${files[0].name}`
    : `✓ ${files.length} Dateien ausgewählt`;
  if (formId) {
    setTimeout(() => document.getElementById(formId).submit(), 400);
  } else {
    // For photos this path is only called from clipboard paste handler
    const row = document.getElementById('photo-submit-row');
    if (row) row.classList.remove('d-none');
  }
}
function dzShowNames(input, nameId) {
  // For photos: photoFilesSelected handles everything including submit button
  // Only used for non-photo inputs now
  dzPickFile(input, nameId, null);
}

// ── Fullscreen map ───────────────────────────────────────────────────────────
let isFullscreen = false;
function toggleFullscreen() {
  const wrap = document.getElementById('map-wrap');
  const card = document.getElementById('map-card');
  const icon = document.getElementById('fs-icon');
  const mapEl = document.getElementById('tour-map');

  if (!isFullscreen) {
    // Enter fullscreen — z-index 1040 stays BELOW Bootstrap modal (1055)
    // so lightbox always appears in front of the fullscreen map
    wrap.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1040;background:#000';
    mapEl.style.height = '100vh';
    card.style.zIndex = '1040';
    icon.className = 'bi bi-fullscreen-exit';
    document.body.style.overflow = 'hidden';
    isFullscreen = true;
  } else {
    // Exit fullscreen
    wrap.style.cssText = '';
    mapEl.style.height = '460px';
    card.style.zIndex = '';
    icon.className = 'bi bi-arrows-fullscreen';
    document.body.style.overflow = '';
    isFullscreen = false;
  }
  setTimeout(() => map.invalidateSize(), 50);
}

// ESC key exits fullscreen
document.addEventListener('keydown', e => { if (e.key === 'Escape' && isFullscreen) toggleFullscreen(); });

// ── Re-extract GPS from EXIF (AJAX) ──────────────────────────────────────────
function reextractGps(photoId, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
  fetch('/api/fotos/' + photoId + '/reextract-gps')
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        btn.closest('.col-6, .col-sm-4, .col-md-3').querySelector('.badge').className =
          'badge bg-success position-absolute top-0 end-0 m-1';
        btn.closest('.col-6, .col-sm-4, .col-md-3').querySelector('.badge').innerHTML =
          '<i class="bi bi-geo-alt-fill"></i>';
        showToast('✅ GPS gefunden: ' + d.lat + ', ' + d.lng + ' – Seite neu laden!', 'success');
      } else {
        showToast('⚠️ ' + d.msg, 'warning');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
      }
    })
    .catch(() => { btn.disabled = false; btn.innerHTML = '<i class="bi bi-arrow-repeat"></i>'; });
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = `alert alert-${type} position-fixed bottom-0 end-0 m-3 shadow`;
  t.style.zIndex = 9999;
  t.innerHTML = msg + ' <button class="btn-close float-end" onclick="this.parentElement.remove()"></button>';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

const GPX_DATA = {{ gpx_data | safe }};
const MEETING_LAT = {{ tour.meeting_lat or 'null' }};
const MEETING_LNG = {{ tour.meeting_lng or 'null' }};
const PHOTOS = [
  {% for p in photos %}{% if p.has_gps %}
  { id: {{ p.id }},
    lat: {{ p.lat }}, lng: {{ p.lng }},
    src: "{{ url_for('serve_photo', filename=p.filename) }}",
    cap: {{ (p.caption or '')|tojson }},
    user: {{ p.user.display_name|tojson }},
    date: "{{ (p.taken_at or p.created_at).strftime('%d.%m.%Y %H:%M') }}",
    is_taken: {{ 'true' if p.taken_at else 'false' }} },
  {% endif %}{% endfor %}
];

// ── Leaflet map ──────────────────────────────────────────────────────────────let center = [53.1, 9.2];
let zoom   = 10;

if (GPX_DATA && GPX_DATA.points && GPX_DATA.points.length > 0) {
  center = [GPX_DATA.points[0].lat, GPX_DATA.points[0].lng];
  zoom   = 12;
} else if (MEETING_LAT) {
  center = [MEETING_LAT, MEETING_LNG];
  zoom   = 13;
}

const map = L.map('tour-map', {zoomControl: true}).setView(center, zoom);

// Fix Leaflet sizing: force re-render after Bootstrap grid settles
// Multiple delays to catch different rendering phases
[50, 150, 300, 600].forEach(ms => setTimeout(() => map.invalidateSize(false), ms));
window.addEventListener('load', () => {
  map.invalidateSize(false);
  setTimeout(() => map.invalidateSize(false), 200);
});

// ── Tile layers ───────────────────────────────────────────────────────────────
const tileLayers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri – Source: Esri, DigitalGlobe, USDA FSA',
    maxZoom: 19
  }),
  topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://opentopomap.org">OpenTopoMap</a>',
    maxZoom: 17
  })
};
tileLayers.osm.addTo(map);
let activeLayer = 'osm';

function switchLayer(name, btn) {
  if (activeLayer === name) return;
  map.removeLayer(tileLayers[activeLayer]);
  tileLayers[name].addTo(map);
  activeLayer = name;
  document.querySelectorAll('#btn-osm,#btn-sat,#btn-topo').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// GPX track
if (GPX_DATA && GPX_DATA.points && GPX_DATA.points.length > 0) {
  const latlngs = GPX_DATA.points.map(p => [p.lat, p.lng]);

  // Weißer Schatten-Layer darunter für Kontrast auf dunklem Satellit
  L.polyline(latlngs, {
    color: '#ffffff', weight: 8, opacity: .7
  }).addTo(map);
  // Hauptlinie: leuchtendes Orange – sichtbar auf Satellit UND Straßenkarte
  const poly = L.polyline(latlngs, {
    color: '#FF6A00', weight: 5, opacity: .95
  }).addTo(map);
  map.fitBounds(poly.getBounds(), {padding:[20,20]});

  // Start / end markers
  const startIcon = L.divIcon({
    html: '<div style="background:#2E7D4F;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold">S</div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
  const endIcon = L.divIcon({
    html: '<div style="background:#C0392B;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold">Z</div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
  L.marker(latlngs[0], {icon: startIcon}).addTo(map).bindPopup('<b>Start</b>');
  L.marker(latlngs[latlngs.length-1], {icon: endIcon}).addTo(map).bindPopup('<b>Ziel</b>');
}

// Meeting point marker
if (MEETING_LAT) {
  const meetIcon = L.divIcon({
    html: '<div style="background:#B85C00;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;">📍</div>',
    iconSize:[30,30], iconAnchor:[15,15]
  });
  L.marker([MEETING_LAT, MEETING_LNG], {icon: meetIcon})
   .addTo(map)
   .bindPopup('<b>Treffpunkt</b><br>{{ tour.meeting_desc or "" }}');
}

// Photo markers – with MarkerCluster + hover sync
// Graceful fallback: use a LayerGroup if MarkerClusterGroup not available
let photoCluster;
if (typeof L.markerClusterGroup === 'function') {
  photoCluster = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      return L.divIcon({
        html: `<div style="background:rgba(43,63,107,.9);color:#fff;border-radius:6px;
                           min-width:36px;height:36px;display:flex;align-items:center;
                           justify-content:center;font-size:11px;font-weight:700;padding:0 6px;
                           border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">
                 📷${count}
               </div>`,
        iconSize: null, iconAnchor: [18, 18], className: ''
      });
    }
  });
} else {
  console.warn('MarkerCluster nicht geladen, verwende einfache Marker');
  photoCluster = L.layerGroup();
}
map.addLayer(photoCluster);

const photoMarkers = {};
PHOTOS.forEach(p => {
  const normalIcon = L.divIcon({
    html: `<div style="background:#fff;border:2px solid #2B3F6B;border-radius:4px;width:42px;height:36px;overflow:hidden;transition:transform .15s">
             <img src="${p.src}" style="width:100%;height:100%;object-fit:cover">
           </div>`,
    iconSize:[42,36], iconAnchor:[21,18], className:''
  });
  const activeIcon = L.divIcon({
    html: `<div style="background:#fff;border:3px solid #C0392B;border-radius:6px;width:56px;height:48px;overflow:hidden;
                       box-shadow:0 0 0 3px rgba(192,57,43,.4);transform:scale(1.1)">
             <img src="${p.src}" style="width:100%;height:100%;object-fit:cover">
           </div>`,
    iconSize:[56,48], iconAnchor:[28,24], className:''
  });

  const capHtml = p.cap
    ? `<div style="font-size:.82rem;font-weight:600;color:#222;margin:4px 0 2px">${p.cap}</div>`
    : '';
  const escapedCap = p.cap ? p.cap.replace(/'/g, "&#39;") : '';
  const popup = L.popup({maxWidth:240, className:'photo-popup'}).setContent(`
    <div style="text-align:center">
      <img src="${p.src}"
           style="width:220px;max-height:180px;object-fit:cover;border-radius:4px;
                  display:block;cursor:zoom-in"
           onclick="openLightbox('${p.src}','${escapedCap}')"
           title="Klicken zum Vergrößern">
      ${capHtml}
      <div style="font-size:.68rem;color:#aaa;margin-top:2px">🔍 Tippen zum Vergrößern</div>
      <div style="font-size:.72rem;color:#888;margin-top:3px">
        ${p.is_taken ? '📸' : '📤'} ${p.date} &middot; ${p.user}
      </div>
    </div>
  `);

  const marker = L.marker([p.lat, p.lng], {icon: normalIcon})
    .bindPopup(popup);
  photoCluster.addLayer(marker);

  photoMarkers[p.id] = { marker, normalIcon, activeIcon };
});

// Highlight marker when hovering photo thumbnail
function highlightMarker(photoId) {
  const pm = photoMarkers[photoId];
  if (!pm) return;
  pm.marker.setIcon(pm.activeIcon);
  map.panTo(pm.marker.getLatLng(), {animate: true, duration: 0.4});
}
function unhighlightMarker(photoId) {
  const pm = photoMarkers[photoId];
  if (pm && !pm.marker.isPopupOpen()) pm.marker.setIcon(pm.normalIcon);
}
function jumpToMarker(photoId) {
  const pm = photoMarkers[photoId];
  if (!pm) return;
  map.setView(pm.marker.getLatLng(), Math.max(map.getZoom(), 15), {animate:true});
  pm.marker.openPopup();
}

// ── Weather widget ───────────────────────────────────────────────────────────
(function() {
  const tourDate = '{{ tour.tour_date.isoformat() if (tour.tour_date and not tour.is_date_open) else "" }}';
  const today    = new Date().toISOString().split('T')[0];
  if (tourDate < today) return;   // past tour – skip

  // Use meeting point or GPX start for location
  let lat = MEETING_LAT || (GPX_DATA && GPX_DATA.points[0] ? GPX_DATA.points[0].lat : null);
  let lng = MEETING_LNG || (GPX_DATA && GPX_DATA.points[0] ? GPX_DATA.points[0].lng : null);
  if (!lat) { lat = 53.1; lng = 9.2; }   // fallback: Ottersberg

  const card = document.getElementById('weather-card');
  const body = document.getElementById('weather-body');
  if (!card) return;
  card.removeAttribute('style');

  // Parse start hour from tour start_time
  const startTimeStr = '{{ tour.start_time or "09:00" }}';
  const startHour = parseInt(startTimeStr.split(':')[0]) || 9;

  fetch(`/api/wetter?lat=${lat}&lng=${lng}&date=${tourDate}&hour=${startHour}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) { card.style.display='none'; return; }

      const rainColor   = d.rain_pct > 60 ? 'danger' : d.rain_pct > 30 ? 'warning' : 'success';
      const windBad     = d.wind_kmh > 35;
      const rainBad     = d.rain_pct > 60;
      const uvHigh      = d.uv && d.uv >= 6;

      // Warning badges
      let warnings = '';
      if (rainBad)  warnings += '<span class="badge bg-danger me-1">🌧️ Regenwahrscheinlich</span>';
      if (windBad)  warnings += '<span class="badge bg-warning text-dark me-1">💨 Starker Wind</span>';
      if (uvHigh)   warnings += '<span class="badge bg-orange text-dark me-1">☀️ UV hoch</span>';
      if (!warnings && d.rain_pct < 20 && !windBad)
        warnings = '<span class="badge bg-success">🌞 Gutes Wetter!</span>';

      // Stündliche Daten für Startzeit
      let hourlyBlock = '';
      if (d.hourly && d.hourly.temp !== null && d.hourly.temp !== undefined) {
        const h = d.hourly;
        const hRainC = h.rain_pct > 60 ? 'danger' : h.rain_pct > 30 ? 'warning' : 'success';
        hourlyBlock = `
          <div class="border-top pt-2 mt-2">
            <div class="small text-muted fw-semibold mb-1">
              ${d.hourly.icon} Prognose für ${startHour}:00 Uhr
            </div>
            <div class="row g-1 text-center" style="font-size:.82rem">
              <div class="col-4">
                <div class="text-muted small">Temp</div>
                <div class="fw-bold">${h.temp}°C</div>
              </div>
              <div class="col-4">
                <div class="text-muted small">Regen</div>
                <div class="fw-bold text-${hRainC}">${h.rain_pct}%</div>
              </div>
              <div class="col-4">
                <div class="text-muted small">Wind</div>
                <div class="fw-bold">${h.wind_dir} ${h.wind} km/h</div>
              </div>
            </div>
          </div>`;
      }

      body.innerHTML = `
        <div class="d-flex align-items-center gap-2 mb-2">
          <span style="font-size:2rem">${d.icon}</span>
          <div>
            <div class="fw-semibold">${d.label}</div>
            <div class="small text-muted">Tagesprognose</div>
          </div>
        </div>
        <div class="row g-2 text-center mb-2">
          <div class="col-6">
            <div class="small text-muted">🌡️ Temperatur</div>
            <div class="fw-bold">${d.temp_min}° – ${d.temp_max}°C</div>
          </div>
          <div class="col-6">
            <div class="small text-muted">💨 Wind max.</div>
            <div class="fw-bold ${windBad ? 'text-warning' : ''}">
              ${d.wind_dir} ${d.wind_kmh} km/h
              ${d.wind_gusts ? `<small class="text-muted">(Böen ${d.wind_gusts})</small>` : ''}
            </div>
          </div>
          <div class="col-6">
            <div class="small text-muted">🌧️ Niederschlag</div>
            <div class="fw-bold">${d.rain_mm} mm</div>
          </div>
          <div class="col-6">
            <div class="small text-muted">☔ Regenrisiko</div>
            <div class="fw-bold text-${rainColor}">${d.rain_pct}%</div>
          </div>
          ${d.uv ? `
          <div class="col-6">
            <div class="small text-muted">☀️ UV-Index</div>
            <div class="fw-bold ${uvHigh ? 'text-warning' : ''}">${d.uv}</div>
          </div>` : ''}
        </div>
        <div class="text-center mb-2">${warnings}</div>
        ${hourlyBlock}
        <div class="text-muted text-center mt-2" style="font-size:.65rem">
          Quelle: Open-Meteo · Daten für Tourstartort
        </div>`;
    })
    .catch(() => { card.style.display = 'none'; });
})();
// ── Debug: log why elevation chart might not render ─────────────────────────
if (!GPX_DATA) console.warn('Höhenprofil: GPX_DATA ist null/leer');
else if (!document.getElementById('elevation-chart')) console.warn('Höhenprofil: canvas nicht gefunden');
else if (!GPX_DATA.points || !GPX_DATA.points.length) console.warn('Höhenprofil: keine Punkte im GPX');
else console.log('Höhenprofil: initialisiere mit', GPX_DATA.points.length, 'Punkten');

if (GPX_DATA && GPX_DATA.points && GPX_DATA.points.length && document.getElementById('elevation-chart')) {
  const allPts = GPX_DATA.points;
  const step   = Math.max(1, Math.floor(allPts.length / 300));
  const pts    = allPts.filter((_, i) => i % step === 0);
  const eles   = pts.map(p => p.ele);

  // Pre-calc cumulative distance (km) for each sampled point
  function haverDist(a, b) {
    const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLon = (b.lng-a.lng)*Math.PI/180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }
  const cumKm = [0];
  for (let i = 1; i < pts.length; i++) {
    cumKm.push(cumKm[i-1] + haverDist(pts[i-1], pts[i]));
  }

  // Pre-calc cumulative elevation gain
  const cumGain = [0];
  for (let i = 1; i < pts.length; i++) {
    const diff = pts[i].ele - pts[i-1].ele;
    cumGain.push(cumGain[i-1] + (diff > 0 ? diff : 0));
  }

  // Map crosshair marker
  const crosshairIcon = L.divIcon({
    html: '<div style="width:14px;height:14px;background:#C0392B;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(192,57,43,.7)"></div>',
    iconSize:[14,14], iconAnchor:[7,7], className:''
  });
  let crosshair = null;

  const chart = new Chart(document.getElementById('elevation-chart'), {
    type: 'line',
    data: {
      labels: pts.map((_, i) => i),
      datasets: [{
        data: eles,
        borderColor: '#2B3F6B',
        backgroundColor: 'rgba(43,63,107,.15)',
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: '#C0392B',
        pointHoverBorderColor: '#fff',
        pointHoverBorderWidth: 2,
        borderWidth: 2
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(43,63,107,.92)',
          titleColor: '#fff',
          bodyColor: '#d0d8f0',
          padding: 10,
          cornerRadius: 6,
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return `Km ${cumKm[i].toFixed(2)}`;
            },
            label: (item) => {
              const i = item.dataIndex;
              return [
                `⛰️  Höhe: ${eles[i].toFixed(0)} m`,
                `↗️  Anstieg: ${cumGain[i].toFixed(0)} m`,
                `📍  ${pts[i].lat.toFixed(5)}, ${pts[i].lng.toFixed(5)}`
              ];
            }
          }
        }
      },
      hover: { mode: 'index', intersect: false },
      scales: {
        x: { display: false },
        y: {
          grid: { color: 'rgba(0,0,0,.06)' },
          ticks: { font: { size: 10 },
            callback: v => v + ' m' }
        }
      },
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      onHover: (evt, elements) => {
        if (!elements || !elements.length) {
          // Hide info bar + remove crosshair
          document.getElementById('elev-info').style.display = 'none';
          if (crosshair) { map.removeLayer(crosshair); crosshair = null; }
          return;
        }
        const i = elements[0].index;
        const pt = pts[i];

        // Show info bar
        const info = document.getElementById('elev-info');
        info.classList.remove('d-none');
        document.getElementById('ei-km').textContent   = cumKm[i].toFixed(2) + ' km';
        document.getElementById('ei-ele').textContent  = pt.ele.toFixed(0);
        document.getElementById('ei-gain').textContent = cumGain[i].toFixed(0);
        document.getElementById('ei-coords').textContent = `${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}`;

        // Move/create crosshair on map
        if (crosshair) {
          crosshair.setLatLng([pt.lat, pt.lng]);
        } else {
          crosshair = L.marker([pt.lat, pt.lng], { icon: crosshairIcon, zIndexOffset: 1000 }).addTo(map);
        }
      }
    }
  });
}
</script>

<script>

// ── Live-Standort ─────────────────────────────────────────────────────────────
const TOUR_ID = {{ tour.id }};
let _liveActive   = false;
let _liveWatchId  = null;
let _liveInterval = null;
let _liveMarkers  = {};

function toggleLiveLocation() {
  if (_liveActive) {
    stopLiveLocation();
  } else {
    startLiveLocation();
  }
}

function startLiveLocation() {
  if (!navigator.geolocation) { alert('GPS nicht verfügbar.'); return; }
  const btn = document.getElementById('live-btn');
  if (btn) { btn.classList.add('btn-success'); btn.classList.remove('btn-outline-success'); }
  _liveActive = true;

  _liveWatchId = navigator.geolocation.watchPosition(pos => {
    fetch('/api/location/update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        tour_id:  TOUR_ID,
        lat:      pos.coords.latitude,
        lng:      pos.coords.longitude,
        accuracy: pos.coords.accuracy
      })
    }).catch(() => {});
  }, null, {enableHighAccuracy: true, maximumAge: 10000});

  // Andere Standorte alle 15s abrufen
  _pollLiveLocations();
  _liveInterval = setInterval(_pollLiveLocations, 15000);
}

function stopLiveLocation() {
  _liveActive = false;
  if (_liveWatchId) navigator.geolocation.clearWatch(_liveWatchId);
  if (_liveInterval) clearInterval(_liveInterval);
  fetch('/api/location/stop', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({tour_id: TOUR_ID})
  }).catch(() => {});
  const btn = document.getElementById('live-btn');
  if (btn) { btn.classList.remove('btn-success'); btn.classList.add('btn-outline-success'); }
  Object.values(_liveMarkers).forEach(m => map.removeLayer(m));
  _liveMarkers = {};
}

function _pollLiveLocations() {
  fetch('/api/location/tour/' + TOUR_ID)
    .then(r => r.json())
    .then(data => {
      if (!data.locations) return;
      const seen = new Set();
      data.locations.forEach(loc => {
        seen.add(loc.user_id);
        const freshness = loc.ago < 30 ? '#00c851' : loc.ago < 120 ? '#ffbb33' : '#ff4444';
        const icon = L.divIcon({
          html: '<div style="background:' + freshness + ';width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>',
          iconSize: [14,14], iconAnchor: [7,7], className: ''
        });
        const popup = '<b>' + loc.name + '</b><br><small>vor ' + loc.ago + 's</small>';
        if (_liveMarkers[loc.user_id]) {
          _liveMarkers[loc.user_id].setLatLng([loc.lat, loc.lng])
                                   .setPopupContent(popup);
        } else {
          _liveMarkers[loc.user_id] = L.marker([loc.lat, loc.lng], {icon})
            .bindPopup(popup).addTo(map);
        }
      });
      // Entferne abgelaufene Marker
      Object.keys(_liveMarkers).forEach(uid => {
        if (!seen.has(parseInt(uid))) {
          map.removeLayer(_liveMarkers[uid]);
          delete _liveMarkers[uid];
        }
      });
    }).catch(() => {});
}

// ── Offline Map Tiles voraus-cachen ──────────────────────────────────────────
function prefetchTilesForGPX(bounds, maxZoom) {
  if (!('serviceWorker' in navigator) || !bounds) return;
  navigator.serviceWorker.ready.then(reg => {
    const tiles = [];
    for (let z = 10; z <= Math.min(maxZoom || 15, 15); z++) {
      const min = latLngToTile(bounds.getSouth(), bounds.getWest(), z);
      const max = latLngToTile(bounds.getNorth(), bounds.getEast(), z);
      for (let x = min.x; x <= max.x; x++) {
        for (let y = max.y; y <= min.y; y++) {
          tiles.push('https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png');
        }
      }
    }
    if (tiles.length > 500) return; // Zu viele Kacheln
    const ch = new MessageChannel();
    ch.port1.onmessage = e => {
      if (e.data.ok) console.log('Offline-Karte: ' + e.data.count + ' Kacheln gecacht');
    };
    reg.active.postMessage({type: 'PREFETCH_TILES', tiles}, [ch.port2]);
  });
}

function latLngToTile(lat, lng, zoom) {
  const n = Math.pow(2, zoom);
  const x = Math.floor((lng + 180) / 360 * n);
  const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
  return {x, y};
}
