<div class="modal fade" id="lightboxModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"
       style="max-width:100vw;margin:0;width:100vw">
    <div class="modal-content border-0" style="background:#000;border-radius:0">
      <div class="modal-header border-0 py-1 px-2" style="background:#111">
        <span class="text-white small" id="lb-counter"></span>
        <span class="text-white small text-center flex-grow-1" id="lb-cap"></span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0 d-flex align-items-center justify-content-center position-relative"
           id="lb-body" style="background:#000;height:92vh;height:92dvh">
        <button id="lb-prev" onclick="lbNav(-1)"
                class="position-absolute d-none d-md-flex align-items-center justify-content-center"
                style="left:0;top:0;bottom:0;width:48px;background:rgba(0,0,0,.4);
                       border:0;color:#fff;font-size:2rem;cursor:pointer;z-index:10">‹</button>
        <button id="lb-next" onclick="lbNav(1)"
                class="position-absolute d-none d-md-flex align-items-center justify-content-center"
                style="right:0;top:0;bottom:0;width:48px;background:rgba(0,0,0,.4);
                       border:0;color:#fff;font-size:2rem;cursor:pointer;z-index:10">›</button>
        <img id="lightbox-img" src="" alt=""
             style="max-width:100%;max-height:92vh;max-height:92dvh;
                    width:auto;height:auto;object-fit:contain;display:block">
      </div>
    </div>
  </div>
</div>
