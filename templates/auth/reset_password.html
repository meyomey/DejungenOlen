{% extends "base.html" %}
{% block title %}Neues Passwort – De jungen Olen{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-9 col-md-5">
    <div class="card shadow-sm">
      <div class="card-header card-header-djo">
        <i class="bi bi-lock me-2"></i>Neues Passwort setzen
      </div>
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Neues Passwort</label>
            <input type="password" name="password" class="form-control" required minlength="8" placeholder="Mindestens 8 Zeichen">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Bestätigen</label>
            <input type="password" name="password2" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-djo w-100">Passwort speichern</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
