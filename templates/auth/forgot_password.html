{% extends "base.html" %}
{% block title %}Passwort vergessen – De jungen Olen{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-9 col-md-5">
    <div class="card shadow-sm">
      <div class="card-header card-header-djo">
        <i class="bi bi-key me-2"></i>Passwort vergessen
      </div>
      <div class="card-body p-4">
        <p class="text-muted small">Gib deine E-Mail ein. Der Admin erhält einen Reset-Link.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">E-Mail</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <button type="submit" class="btn btn-djo w-100">
            <i class="bi bi-send me-1"></i>Reset-Link anfordern
          </button>
        </form>
      </div>
      <div class="card-footer text-center">
        <a href="{{ url_for('login') }}" class="text-muted small">← Zurück zum Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
